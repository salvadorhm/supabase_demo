$def with(datos)
<h1>Contactos</h1>

<a href="/insertar_contacto">Nuevo contacto</a>

<table>
    <thead>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Ver</th>
        <th>Actualizar</th>
        <th>Borrar</th>
    </thead>
    <tbody>
        $for registro in datos:
            <tr>
                <td>$registro["id_contacto"]</td>
                <td>$registro["nombre"]</td>
                <td>$registro["email"]</td>
                <td>$registro["telefono"]</td>
                <td><a href="/ver_contacto/$registro['id_contacto']">Ver</a></td>
                <td><a href="/actualizar_contacto/$registro['id_contacto']">Actualizar</a></td>
                <td><a href="/borrar_contacto/$registro['id_contacto']">Borrar</a></td>
            </tr>
    </tbody>
</table>
